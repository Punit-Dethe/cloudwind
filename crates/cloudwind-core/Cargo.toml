[package]
name = "cloudwind-core"
description = "Shared encryption, file format and hashing for Cloudwind"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["stream"] }
sha2 = "0.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
hmac = "0.12"
