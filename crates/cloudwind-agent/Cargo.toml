[package]
name = "cloudwind-agent"
description = "Cloudwind PC agent: pulls encrypted photos from the inbox into your photo folder"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cloudwind"
path = "src/main.rs"

[dependencies]
cloudwind-core = { path = "../cloudwind-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
