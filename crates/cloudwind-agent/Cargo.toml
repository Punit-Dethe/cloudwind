[package]
name = "cloudwind-agent"
description = "Cloudwind PC agent: pulls encrypted photos from the inbox into your photo folder"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cloudwind"
path = "src/main.rs"

[dependencies]
cloudwind-core = { path = "../cloudwind-core" }
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["native-certs", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tiny_http = { version = "0.12.0", features = ["ssl-rustls"] }
rcgen = "0.14.10"
if-addrs = "0.15.0"

[dev-dependencies]
tempfile = "3"
